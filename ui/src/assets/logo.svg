<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Paper & Parchment Subtle Background Texture Gradient -->
    <radialGradient id="paperAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f2eb" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ebe6dc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ebe6dc" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich Archival Sumi Ink Gradients -->
    <linearGradient id="inkPrimary" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="inkLeftStalk" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2d2a26"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <linearGradient id="inkRightStalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <linearGradient id="inkCoreLeft" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <linearGradient id="inkCoreRight" x1="0%" y1="70%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <!-- Warm Sepia/Parchment Facet Keystone -->
    <linearGradient id="keystoneParchment" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f4efe6"/>
      <stop offset="100%" stop-color="#e7dfd1"/>
    </linearGradient>

    <!-- Vermilion / Red Seal Accent Gradient (Traditional Ink Stamp / Editorial Marker) -->
    <linearGradient id="vermilionSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="terracottaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <filter id="softInkBleed" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c1917" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1c1917" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Paper Wash Circle -->
  <circle cx="256" cy="256" r="232" fill="url(#paperAura)" />

  <!-- Outer Fine Hairline Circle (Cartographic / Draftsman Reference Ring) -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#d6cfc4" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.65" />

  <!-- Main Emblem Group: Tactile Ink & Paper Precision Geometry -->
  <g filter="url(#softInkBleed)">
    <!-- Left Wing Column (Rich Deep Charcoal Ink) -->
    <path d="M 124 374 L 124 196 C 124 168 144 148 172 148 L 180 148 C 196 148 210 156 218 170 L 256 238 L 198 340 C 190 354 176 364 160 368 Z" 
          fill="url(#inkLeftStalk)"/>

    <!-- Right Wing Column (Deep Sumi Ink with Warm Undertone) -->
    <path d="M 388 374 L 388 196 C 388 168 368 148 340 148 L 332 148 C 316 148 302 156 294 170 L 256 238 L 314 340 C 322 354 336 364 352 368 Z" 
          fill="url(#inkRightStalk)"/>

    <!-- Inner Core V-Channel - Left Wing -->
    <path d="M 256 238 L 186 364 C 178 378 190 396 206 396 L 226 396 C 238 396 248 390 256 380 L 256 238 Z" 
          fill="url(#inkCoreLeft)"/>

    <!-- Inner Core V-Channel - Right Wing -->
    <path d="M 256 238 L 326 364 C 334 378 322 396 306 396 L 286 396 C 274 396 264 390 256 380 L 256 238 Z" 
          fill="url(#inkCoreRight)"/>

    <!-- Kinetic Diamond Keystone (Parchment Ivory Cutout / Crystalline Paper Apex) -->
    <path d="M 256 120 L 296 182 L 256 244 L 216 182 Z" 
          fill="url(#keystoneParchment)" 
          stroke="#1c1917" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Editorial Precision Lines / Ruled Pen Ink Connections -->
    <path d="M 256 120 L 256 244" stroke="#1c1917" stroke-width="2" stroke-linecap="round"/>
    <path d="M 216 182 L 296 182" stroke="#52525b" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 172 148 L 216 182" stroke="#71717a" stroke-width="1.5"/>
    <path d="M 340 148 L 296 182" stroke="#71717a" stroke-width="1.5"/>
    
    <!-- Vertical Spine Stitch / Synaptic Marrow Dashed Cord -->
    <path d="M 256 244 L 256 380" stroke="#f4efe6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>

  <!-- Drafting Nodes & Traditional Vermilion Red Ink Seal Accents -->
  <!-- Center Synapse Node: Archival Red Vermilion Seal (Punctum / Focal Thought) -->
  <circle cx="256" cy="244" r="10" fill="url(#vermilionSeal)" filter="drop-shadow(0 2px 4px rgba(185,28,28,0.4))"/>
  <circle cx="256" cy="244" r="4" fill="#fdfbf7"/>

  <!-- Top Keystone Node: Crisp Ivory & Ink Nib -->
  <circle cx="256" cy="120" r="8" fill="#fdfbf7" stroke="#18181b" stroke-width="2.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
  <circle cx="256" cy="120" r="3" fill="#18181b"/>

  <!-- Left Apex Node: Paper White with Charcoal Core -->
  <circle cx="172" cy="148" r="7" fill="#fdfbf7" stroke="#27272a" stroke-width="2"/>
  <circle cx="172" cy="148" r="2.5" fill="#27272a"/>

  <!-- Right Apex Node: Paper White with Charcoal Core -->
  <circle cx="340" cy="148" r="7" fill="#fdfbf7" stroke="#27272a" stroke-width="2"/>
  <circle cx="340" cy="148" r="2.5" fill="#27272a"/>

  <!-- Bottom Core Base Anchor Node (Warm Terracotta / Vermilion Echo) -->
  <circle cx="256" cy="380" r="6" fill="#fdfbf7" stroke="#dc2626" stroke-width="2"/>
  <circle cx="256" cy="380" r="2.5" fill="#dc2626"/>
</svg>