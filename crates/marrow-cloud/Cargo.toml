[package]
name = "marrow-cloud"
description = "Sync with Google Drive, OneDrive and Dropbox for Marrow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
marrow-core = { path = "../marrow-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
