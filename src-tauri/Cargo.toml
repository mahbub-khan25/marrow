[package]
name = "marrow-app"
description = "Marrow desktop app (Tauri shell around marrow-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
marrow-core = { path = "../crates/marrow-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
dunce = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
# Pasting screenshots where the webview doesn't pass images through.
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"

# API keys for AI providers go in the system's credential store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
