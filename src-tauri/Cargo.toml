[package]
name = "marrow-app"
description = "Marrow app for desktop and mobile (Tauri shell around marrow-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Shared by the desktop app (main.rs) and the iOS and Android apps.
name = "marrow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
marrow-core = { path = "../crates/marrow-core" }
marrow-webdav = { path = "../crates/marrow-webdav" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
dunce = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "blocking", "multipart"] }
# Reading WebDAV server replies.
quick-xml = "0.37"
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
png = "0.17"

# Desktop only: quick capture from any app, one copy at a time, and pasting
# screenshots where the webview doesn't pass images through.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
arboard = { version = "3", default-features = false, features = ["image-data"] }

[dev-dependencies]
tempfile = { workspace = true }

# API keys for AI providers go in the system's credential store.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
