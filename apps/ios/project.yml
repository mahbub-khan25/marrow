# The Xcode project, made with XcodeGen:  cd apps/ios && ./build-rust.sh && xcodegen
# (build-rust.sh builds the engine and writes the Swift bindings into Generated/.)
name: Marrow
options:
  bundleIdPrefix: app.marrow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Generated/Version.xcconfig
  Release: Generated/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # choose your team in Xcode (Signing & Capabilities)
    TARGETED_DEVICE_FAMILY: "1,2"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/rust/iphoneos
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/rust/iphonesimulator
    OTHER_LDFLAGS: -lmarrow_ffi
    SWIFT_INCLUDE_PATHS: $(PROJECT_DIR)/Generated
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Marrow:
    type: application
    platform: iOS
    sources:
      - path: Marrow
        excludes: ["Info.plist"]
      - path: Generated/MarrowCore.swift
    # iCloud: Marrow's own folder in iCloud Drive, shown there as "Marrow".
    # Needs a paid Apple developer team (a free one can't use iCloud: delete
    # these lines to build with one).
    entitlements:
      path: Marrow/Marrow.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.app.marrow.notes]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.app.marrow.notes]
    info:
      path: Marrow/Info.plist
      properties:
        CFBundleDisplayName: Marrow
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, bn]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: Paper
        # The vault shows in the Files app (On My iPhone › Marrow).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts: [Literata.ttf, Literata-Italic.ttf, EBGaramond.ttf, EBGaramond-Italic.ttf]
        NSSpeechRecognitionUsageDescription: Marrow turns what you say into text in your note, on this device when it can.
        NSMicrophoneUsageDescription: Marrow listens while you dictate a note.
        NSCameraUsageDescription: Take a photo to add to a note.
        NSPhotoLibraryUsageDescription: Add photos to your notes.
        NSLocalNetworkUsageDescription: To reach a sync server or an AI on your own network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
        NSUbiquitousContainers:
          iCloud.app.marrow.notes:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Marrow
            NSUbiquitousContainerSupportedFolderLevels: Any
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.marrow.capture
            UIApplicationShortcutItemTitle: Quick note
            UIApplicationShortcutItemIconSymbolName: square.and.pencil
          - UIApplicationShortcutItemType: app.marrow.today
            UIApplicationShortcutItemTitle: Today's note
            UIApplicationShortcutItemIconSymbolName: sun.max
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.marrow.notes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MarrowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MarrowUITests
    dependencies:
      - target: Marrow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.marrow.notes.uitests
        TEST_TARGET_NAME: Marrow
schemes:
  Marrow:
    build:
      targets:
        Marrow: all
    test:
      targets:
        - MarrowUITests
      environmentVariables:
        # The screenshot tests open this vault and save pictures here.
        DEMO_VAULT: $(SRCROOT)/../demo-vault
        SHOTS_DIR: $(SRCROOT)/shots
