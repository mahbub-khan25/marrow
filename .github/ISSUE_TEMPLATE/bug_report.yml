name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Marrow version
      description: Settings → About
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Log
      description: Settings → About → Show the log. Paste the last lines here. It contains no note text.
      render: text
