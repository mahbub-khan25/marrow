# Builds the Linux packages (.deb for Ubuntu/Debian, .rpm for Fedora, and
# an AppImage), then installs the .rpm on Fedora and the .deb on Ubuntu to
# prove they install with their dependencies. Runs when packaging changes,
# or by hand from the Actions tab.
name: Linux packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/linux-packages.yml"
      - ".github/workflows/release.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - run: npx tauri build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  install-fedora:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
      - name: Install the .rpm with its dependencies
        run: dnf install -y ./rpm/*.rpm
      - name: Check it's installed and every library is found
        run: |
          rpm -qi marrow
          ! ldd /usr/bin/marrow-app | grep "not found"
          test -f /usr/share/applications/Marrow.desktop

  install-ubuntu:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
      - name: Install the .deb with its dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ./deb/*.deb
      - name: Check every library is found
        run: "! ldd /usr/bin/marrow-app | grep 'not found'"
