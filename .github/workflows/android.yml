# The Android app (Jetpack Compose): builds the engine for phones, the app,
# draws every screen with the real engine (Roborazzi), and starts the release
# APK on an emulator to make sure it runs. That APK can be installed to try it
# (Actions → this run → Artifacts → marrow-android). It's signed with the
# release key once the MARROW_KEYSTORE_* secrets are set (RELEASE.md).
name: Android

on:
  push:
    branches: [main]
    paths: ["apps/android/**", "apps/demo-vault/**", "apps/i18n/**", "apps/build-android.sh", "crates/**", "Cargo.*", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "apps/i18n/**", "crates/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and draw the screens
    runs-on: ubuntu-24.04
    env:
      # Sign-in IDs for Google Drive, OneDrive and Dropbox (crates/marrow-cloud/keys.toml).
      MARROW_GOOGLE_DESKTOP_ID: ${{ secrets.MARROW_GOOGLE_DESKTOP_ID }}
      MARROW_GOOGLE_DESKTOP_SECRET: ${{ secrets.MARROW_GOOGLE_DESKTOP_SECRET }}
      MARROW_GOOGLE_IOS_ID: ${{ secrets.MARROW_GOOGLE_IOS_ID }}
      MARROW_ONEDRIVE_ID: ${{ secrets.MARROW_ONEDRIVE_ID }}
      MARROW_DROPBOX_KEY: ${{ secrets.MARROW_DROPBOX_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-native
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine for Android
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          apps/build-android.sh
      - name: Engine tests
        run: cargo test -p marrow-ffi
      - name: Release signing key (if set up)
        env:
          KEYSTORE_BASE64: ${{ secrets.MARROW_KEYSTORE_BASE64 }}
        run: apps/android/signing.sh
      - name: App and screenshots
        working-directory: apps/android
        env:
          MARROW_KEYSTORE_PASSWORD: ${{ secrets.MARROW_KEYSTORE_PASSWORD }}
          MARROW_KEY_ALIAS: ${{ secrets.MARROW_KEY_ALIAS }}
          MARROW_KEY_PASSWORD: ${{ secrets.MARROW_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease :app:testDebugUnitTest -Proborazzi.test.record=true
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)
          mkdir -p ../../apk
          cp app/build/outputs/apk/release/app-release.apk "../../apk/Marrow_${version}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: marrow-android
          path: apk/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: apps/android/app/screenshots

  emulator:
    name: Run on an emulator
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: marrow-android
          path: apk
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 apps/android/test/smoke.py apk/*.apk emulator-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screens
          path: emulator-screens
