# Push a tag like v1.0.0 to build installers for Windows, macOS and Linux
# (.deb, .rpm, AppImage) and the Android APK, and put
# them on a draft GitHub release. Signing happens only when its secrets are
# set (see RELEASE.md); without them the installers are unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  # Or start it by hand from the Actions tab with a version name such as
  # v0.9.0-beta.1; GitHub creates that tag on the current commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.9.0-beta.1"
        required: true

jobs:
  build:
    permissions:
      contents: write
      id-token: write   # Windows code signing signs in to Azure without a stored password
    # Azure trusts this repository's "release" environment (see RELEASE.md, Windows signing)
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
    runs-on: ${{ matrix.os }}
    env:
      # Sign-in IDs for Google Drive, OneDrive and Dropbox (crates/marrow-cloud/keys.toml).
      MARROW_GOOGLE_DESKTOP_ID: ${{ secrets.MARROW_GOOGLE_DESKTOP_ID }}
      MARROW_GOOGLE_DESKTOP_SECRET: ${{ secrets.MARROW_GOOGLE_DESKTOP_SECRET }}
      MARROW_GOOGLE_IOS_ID: ${{ secrets.MARROW_GOOGLE_IOS_ID }}
      MARROW_ONEDRIVE_ID: ${{ secrets.MARROW_ONEDRIVE_ID }}
      MARROW_DROPBOX_KEY: ${{ secrets.MARROW_DROPBOX_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - name: Tests first
        run: |
          npm test
          cargo test --workspace
      # macOS signing and notarization, only once the Apple secrets are set
      # (empty values would make the build try, and fail, to sign).
      - name: Apple signing (if set up)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "Signing and notarizing the Mac app."
          else
            echo "No Apple certificate set up: the Mac app will be unsigned."
          fi
      # Windows code signing with Azure Artifact Signing, only once the repository variables
      # SIGNING_ACCOUNT, SIGNING_PROFILE and SIGNING_ENDPOINT and the AZURE_* secrets are set.
      - name: Azure sign-in (Windows signing)
        if: runner.os == 'Windows' && vars.SIGNING_ACCOUNT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Windows signing tools (if set up)
        if: runner.os == 'Windows' && vars.SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'signing'
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $tools | Out-Null
          nuget install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory $tools | Out-Null
          $dlib = Get-ChildItem $tools -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1
          $signtool = Get-ChildItem $tools -Recurse -Filter signtool.exe | Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1
          if (-not $dlib -or -not $signtool) { Write-Error "signing tools not found"; exit 1 }
          $meta = Join-Path $tools 'metadata.json'
          @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE; CorrelationId = "marrow-$env:GITHUB_RUN_ID" } | ConvertTo-Json | Set-Content $meta
          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          "ARTIFACT_DLIB_PATH=$($dlib.FullName)" >> $env:GITHUB_ENV
          "ARTIFACT_METADATA_PATH=$meta" >> $env:GITHUB_ENV
          # Tauri signs every binary it builds through this command
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\azure-sign.ps1'
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-File', $script, '%1') } } } } | ConvertTo-Json -Depth 6 | Set-Content src-tauri/tauri.signing.json
          "TAURI_SIGN_ARGS=--config src-tauri/tauri.signing.json" >> $env:GITHUB_ENV
          Write-Host "Windows binaries will be signed with $env:SIGNING_ACCOUNT / $env:SIGNING_PROFILE."
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Marrow ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what's new."
          releaseDraft: true
          # Tags like v0.9.0-beta.1 become pre-releases.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }}
      - name: Check Windows signatures
        if: runner.os == 'Windows' && vars.SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          # The installers people download. (Tauri signs the app inside each installer, then puts the
          # unsigned build back in target/release, so that copy isn't checked.)
          $files = @(Get-ChildItem target/release/bundle -Recurse -Include *.exe, *.msi)
          if ($files.Count -lt 2) { Write-Error "expected the NSIS and MSI installers"; exit 1 }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) is not validly signed"; exit 1 }
          }

  # The Android app, added to the same draft release once the desktop builds
  # are done (signed with the release key when its secrets are set).
  android:
    name: Android APK
    needs: build
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      # Sign-in IDs for Google Drive, OneDrive and Dropbox (crates/marrow-cloud/keys.toml).
      MARROW_GOOGLE_DESKTOP_ID: ${{ secrets.MARROW_GOOGLE_DESKTOP_ID }}
      MARROW_GOOGLE_DESKTOP_SECRET: ${{ secrets.MARROW_GOOGLE_DESKTOP_SECRET }}
      MARROW_GOOGLE_IOS_ID: ${{ secrets.MARROW_GOOGLE_IOS_ID }}
      MARROW_ONEDRIVE_ID: ${{ secrets.MARROW_ONEDRIVE_ID }}
      MARROW_DROPBOX_KEY: ${{ secrets.MARROW_DROPBOX_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-native
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine for Android
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          apps/build-android.sh
      - name: Release signing key (if set up)
        env:
          KEYSTORE_BASE64: ${{ secrets.MARROW_KEYSTORE_BASE64 }}
        run: apps/android/signing.sh
      - name: APK
        working-directory: apps/android
        env:
          MARROW_KEYSTORE_PASSWORD: ${{ secrets.MARROW_KEYSTORE_PASSWORD }}
          MARROW_KEY_ALIAS: ${{ secrets.MARROW_KEY_ALIAS }}
          MARROW_KEY_PASSWORD: ${{ secrets.MARROW_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          apk="Marrow_${version}_android.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            gh release create "$TAG" --draft $pre --title "Marrow $TAG" --notes "See CHANGELOG.md for what's new."
          fi
          gh release upload "$TAG" "$apk" --clobber
      - name: Browser extension (Marrow Clipper)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" clipper/manifest.json
          zip="$PWD/Marrow_Clipper_${version}.zip"
          (cd clipper && zip -qr "$zip" . -x '*.md')
          gh release upload "$TAG" "$zip" --clobber
