# Push a tag like v1.0.0 to build installers for Windows, macOS and Linux
# (.deb, .rpm, AppImage) and put
# them on a draft GitHub release. Signing happens only when its secrets are
# set (see RELEASE.md); without them the installers are unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  # Or start it by hand from the Actions tab with a version name such as
  # v0.9.0-beta.1; GitHub creates that tag on the current commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.9.0-beta.1"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - name: Tests first
        run: |
          npm test
          cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization (optional).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Marrow ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what's new."
          releaseDraft: true
          # Tags like v0.9.0-beta.1 become pre-releases.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}
