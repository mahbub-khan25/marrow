[workspace]
resolver = "2"
members = ["crates/marrow-core", "crates/marrow-webdav", "crates/marrow-cloud", "crates/marrow-ffi", "src-tauri"]

[workspace.package]
edition = "2021"
version = "1.5.0"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.12", default-features = false }
serde_yaml_ng = "0.10"
blake3 = "1"
redb = "2"
rayon = "1"
notify = "7"
notify-debouncer-full = "0.4"
crossbeam-channel = "0.5"
tempfile = "3"
dunce = "1"
similar = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
htmd = "0.1"
base64 = "0.22"
md-5 = "0.10"
csv = "1"
percent-encoding = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"

# Password hashing is far too slow unoptimised; keep it fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
